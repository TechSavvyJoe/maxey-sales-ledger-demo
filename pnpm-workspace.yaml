overrides:
  # ExcelJS uses only the compatible v4 API; keep its UUID dependency patched.
  'exceljs>uuid': 11.1.1
allowBuilds:
  '@firebase/util': false
  protobufjs: false
  re2: false
  '@parcel/watcher': set this to true or false
  '@swc/core': set this to true or false
  lmdb: set this to true or false
  msgpackr-extract: set this to true or false
